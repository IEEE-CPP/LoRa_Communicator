# C++17 and the complete standard library required by Pigweed.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n

# IO Configuration.
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_LORA=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LORA_LOG_LEVEL_DBG=y

# Timestamped demonstration logs, formatted by Zephyr's UART backend.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=3072
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BACKEND_SHOW_TIMESTAMP=y
CONFIG_LOG_BACKEND_SHOW_LEVEL=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Route Pigweed PW_LOG_* messages through Zephyr's UART logging backend.
CONFIG_PIGWEED_LOG_ZEPHYR=y
CONFIG_PIGWEED_LOG_LEVEL_INF=y

# Pigweed's C++ interfaces use the Zephyr kernel underneath.
CONFIG_PIGWEED_SYNC_MUTEX=y
CONFIG_PIGWEED_THREAD=y
CONFIG_PIGWEED_THREAD_SLEEP=y
CONFIG_PIGWEED_CHRONO_SYSTEM_CLOCK=y
CONFIG_MULTITHREADING=y
CONFIG_THREAD_NAME=y
CONFIG_NUM_PREEMPT_PRIORITIES=8
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ASSERT=y
